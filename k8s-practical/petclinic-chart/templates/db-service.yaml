apiVersion: v1
kind: Service
metadata:
  name: {{ include "petclinic.mysql.fullname" . }}
  labels:
    {{- include "petclinic.labels" . | nindent 4 }}
    app.kubernetes.io/component: mysql
spec:
  type: ClusterIP        
  selector:
    {{- include "petclinic.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mysql
  ports:
    - name: mysql
      port: {{ .Values.mysql.service.port }}
      targetPort: mysql