

nameOverride: ""
fullnameOverride: ""

replicaCount: 3

image:
  repository: maljkovica/petclinic
  tag: "1.0"             
  pullPolicy: IfNotPresent

imagePullSecrets: []      

automountServiceAccountToken: false   

app:
  containerPort: 8080
  springProfile: mysql
  waitForMysql:          
    image:
      repository: busybox
      tag: "1.36"
      pullPolicy: IfNotPresent
  readinessProbe:
    httpGet:
      path: /actuator/health
      port: http
    initialDelaySeconds: 40
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  livenessProbe:
    httpGet:
      path: /actuator/health
      port: http
    initialDelaySeconds: 90
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 5
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
  topologySpread:         
    enabled: true
    maxSkew: 1
    whenUnsatisfiable: DoNotSchedule   

service:
  type: LoadBalancer      
  port: 80
  loadBalancerIP: ""      

mysql:
  image:
    repository: mysql
    tag: "8.4"            
    pullPolicy: IfNotPresent
  service:
    port: 3306
  auth:
    existingSecret: ""   
    rootPassword: ""      
    username: petclinic
    password: ""          
    database: petclinic
  persistence:
    enabled: true       
    size: 5Gi
    storageClass: ""     
    accessMode: ReadWriteOnce
    keepOnUninstall: false  
  readinessProbe:
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi